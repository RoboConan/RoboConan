    - patch_file: "patches/8.1-qualify-hevc-includes.patch"
      patch_description: "Qualify HEVC includes to avoid collisions with dependency headers"
      patch_type: "backport"
      patch_source: "https://github.com/FFmpeg/FFmpeg/commit/2797dad73559c1597d3e69ddf9f5ed33467a95c3"
