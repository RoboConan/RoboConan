patches:
  "9.0.2":
    - patch_file: "patches/9.0-deterministic-glslc-disable.patch"
      patch_description: "Allow disabling the SPIR-V compiler without probing ambient PATH"
      patch_type: "conan"
    - patch_file: "patches/9.0-ffmpeg-add-av_stream_get_first_dts-for-chromium.patch"
      patch_description: "Add backwards compatibility with Chromium"
      patch_type: "portability"
      patch_source: "https://github.com/microsoft/vcpkg/blob/fdd63dd662a542a91df65ca776d80e35e31e67be/ports/ffmpeg/0040-ffmpeg-add-av_stream_get_first_dts-for-chromium.patch"
    - patch_file: "patches/9.0-use-pkg-config-for-onnxruntime.patch"
      patch_description: "Use pkg-config to support static ONNX Runtime builds"
      patch_type: "conan"
    - patch_file: "patches/9.0-openapv-1.1.patch"
      patch_description: "Fix build with OpenAPV 1.1 or newer"
      patch_type: "backport"
      patch_source: "https://github.com/FFmpeg/FFmpeg/commit/a7502e5ff39ef53d475b9ee7dd6d4aeb48f047e6"
  "8.1.3":
