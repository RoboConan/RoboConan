  "1.0.3":
    - patch_file: "patches/001-unvendor-deps.patch"
      patch_description: "Use dependencies from Conan"
      patch_type: "conan"
    - patch_file: "patches/002-imgui-1.92-compatibility.patch"
      patch_description: "Use the named-key and content-region APIs supported by ImGui 1.92"
      patch_type: "portability"
    - patch_file: "patches/003-implot-1.0-compatibility.patch"
      patch_description: "Support both pre-1.0 styling calls and the ImPlot 1.0 specification API"
      patch_type: "portability"
