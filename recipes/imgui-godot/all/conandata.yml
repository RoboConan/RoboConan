patches:
  "6.3.3-git.20260517":
    - patch_file: "patches/1.92-compatibility.patch"
      patch_description: "Support Dear ImGui 1.91.9 and 1.92 API changes"
      patch_type: "portability"
    - patch_file: "patches/1.92-renderer-6.3.3.patch"
      patch_description: "Support Dear ImGui 1.92 through its legacy renderer texture path"
      patch_type: "portability"
    - patch_file: "patches/binding-generator.patch"
      patch_description: "Skip unbindable ImGui arrays and avoid invoking an undeclared host clang-format"
      patch_type: "portability"
    - patch_file: "patches/native-gdextension-only.patch"
      patch_description: "Remove C# runtime fallbacks and project checks because only native GDExtension is packaged"
      patch_type: "conan"
    - patch_file: "patches/public-cxx23-header.patch"
      patch_description: "Fix the native C++23 header and cross-extension sync bridge"
      patch_type: "portability"
  "6.3.2":
    - patch_file: "patches/1.92-compatibility.patch"
      patch_description: "Support Dear ImGui 1.91.9 and 1.92 API changes"
      patch_type: "portability"
    - patch_file: "patches/1.92-renderer-6.3.2.patch"
      patch_description: "Support Dear ImGui 1.92 through its legacy renderer texture path"
      patch_type: "portability"
    - patch_file: "patches/6.3.2-godot-cpp-10.patch"
      patch_description: "Backport upstream Godot 4.5 API compatibility changes"
      patch_type: "portability"
    - patch_file: "patches/binding-generator.patch"
      patch_description: "Skip unbindable ImGui arrays and avoid invoking an undeclared host clang-format"
      patch_type: "portability"
    - patch_file: "patches/native-gdextension-only.patch"
      patch_description: "Remove C# runtime fallbacks and project checks because only native GDExtension is packaged"
      patch_type: "conan"
    - patch_file: "patches/public-cxx23-header.patch"
      patch_description: "Fix the native C++23 header and cross-extension sync bridge"
      patch_type: "portability"
