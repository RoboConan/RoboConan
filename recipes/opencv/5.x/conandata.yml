patches:
  "5.0.0":
    - patch_file: "patches/5.0.0-0001-use-packaged-hdf5.patch"
    - patch_file: "patches/5.0.0-0002-keep-tracking-plot-optional.patch"
    - patch_file: "patches/5.0.0-0003-link-openmp-target.patch"
    - patch_file: "patches/5.0.0-0004-use-packaged-ade.patch"
    - patch_file: "patches/5.0.0-0005-fix-zlib-static-android.patch"
    - patch_file: "patches/5.0.0-0006-disable-package-irrelevant-downloads.patch"
    - patch_file: "patches/5.0.0-0007-use-packaged-nvidia-sdks.patch"
    - patch_file: "patches/5.0.0-0008-use-packaged-onnxruntime.patch"
    - patch_file: "patches/5.0.0-0009-use-current-intel-ipp-layout.patch"
    - patch_file: "patches/5.0.0-0010-restore-caffe-protobuf-regeneration.patch"
    - patch_file: "patches/5.0.0-0011-fix-cuda-cccl-namespace.patch"
      patch_description: "Select the CUDA standard-library namespace macros exposed by CCCL"
      patch_type: "portability"
      patch_source: "https://github.com/opencv/opencv_contrib/pull/4097"
    - patch_file: "patches/5.0.0-0012-link-sfm-simple-pipeline-glog.patch"
      patch_description: "Propagate glog headers to the SFM simple pipeline target"
      patch_type: "portability"
    - patch_file: "patches/5.0.0-0013-use-packaged-cpu-features.patch"
      patch_description: "Use the packaged Android NDK CPU-features compatibility library"
    - patch_file: "patches/5.0.0-0014-fix-ovis-and-lapack-integration.patch"
      patch_description: "Respect the project C++ standard in OVIS and imported LAPACK targets"
      patch_type: "portability"
    - patch_file: "patches/5.0.0-0015-include-iostream-in-viz.patch"
      patch_description: "Include the standard stream declarations used by the VIZ module"
      patch_type: "portability"
    - patch_file: "patches/5.0.0-0016-use-qt-imported-targets-in-cvv.patch"
      patch_description: "Link CVV to the Qt imported targets requested by its component discovery"
      patch_type: "portability"
